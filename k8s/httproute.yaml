apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: devops-node-api
  name: devops-node-api

spec:
  parentRefs:
    - name: devops-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: devops-node-api
          port: 80
