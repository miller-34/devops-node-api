apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: devops-node-api
  name: devops-node-api
  labels:
    app: devops-node-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: devops-node-api

  template:
    metadata:
      labels:
        app: devops-node-api

    spec:
      containers:
        - name: devops-node-api
          image: ghcr.io/miller-34/devops-node-api:8d6e77c7c258f4ee2093371d0e0c3844ee7b3109
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
