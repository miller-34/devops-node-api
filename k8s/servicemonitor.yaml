apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-node-api
  namespace: devops-node-api
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: devops-node-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
