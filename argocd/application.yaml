apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-node-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/miller-34/devops-node-api.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-node-api

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
